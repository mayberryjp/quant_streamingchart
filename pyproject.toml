[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-streamingchart"
version = "0.1.0"
description = "Fetch a 1-day intraday chart from Yahoo Finance and replay it to Kafka"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "bottle>=0.13",
  "waitress>=3.0",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "confluent-kafka>=2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "webtest>=3",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["streamchart"]
omit = ["*/__main__.py", "*/api_main.py"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_decorators = false
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["bottle", "waitress", "confluent_kafka", "confluent_kafka.*", "webtest"]
ignore_missing_imports = true
